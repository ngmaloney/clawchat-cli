<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480">
  <defs>
    <style>
      text { font-family: 'Menlo', 'Monaco', 'Lucida Console', monospace; }
      .titlebar-text { font-size: 12px; fill: #888; }
      .header-title { font-size: 13px; fill: #FF8C00; font-weight: bold; }
      .header-meta { font-size: 12px; fill: #777; }
      .badge-connected { font-size: 12px; fill: #5fdf5f; font-weight: bold; }
      .badge-ollama { font-size: 12px; fill: #1a1a1a; font-weight: bold; }
      .label-user { font-size: 13px; fill: #FF8C00; font-weight: bold; }
      .label-assistant { font-size: 13px; fill: #5fb3d4; font-weight: bold; }
      .label-time { font-size: 11px; fill: #555; }
      .msg-body { font-size: 13px; fill: #ddd; }
      .msg-code { font-size: 12px; fill: #adf0ad; }
      .input-text { font-size: 13px; fill: #eee; }
      .help-text { font-size: 11px; fill: #555; }
      .badge-ssh-bg { fill: #5fb3d4; }
    </style>
    <clipPath id="chat-clip">
      <rect x="21" y="62" width="778" height="320" rx="0"/>
    </clipPath>
  </defs>

  <!-- Window background -->
  <rect width="820" height="480" rx="10" fill="#0d0d0d"/>

  <!-- Titlebar -->
  <rect width="820" height="36" rx="10" fill="#2d2d2d"/>
  <rect y="26" width="820" height="10" fill="#2d2d2d"/>
  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="18" r="6" fill="#28ca41"/>
  <text x="410" y="23" text-anchor="middle" class="titlebar-text">clawchat-cli</text>

  <!-- Header bar -->
  <rect y="36" width="820" height="28" fill="#1a1a1a"/>
  <text x="16" y="54" class="header-title">🦀 ClawChat CLI</text>
  <text x="400" y="54" class="header-meta">http://llama.home.wrox.us:11434</text>
  <text x="620" y="54" class="header-meta">qwen2.5:14b</text>
  <!-- Ollama badge -->
  <rect x="700" y="42" width="50" height="16" rx="4" class="badge-ssh-bg"/>
  <text x="708" y="54" class="badge-ollama">ollama</text>
  <!-- Connected badge -->
  <text x="758" y="54" class="badge-connected">● connected</text>

  <!-- Chat box border -->
  <rect x="10" y="70" width="800" height="322" rx="6" fill="none" stroke="#008000" stroke-width="1"/>

  <!-- Messages (clipped) -->
  <g clip-path="url(#chat-clip)">
    <!-- Message 1: user -->
    <text x="22" y="96" class="label-user">you</text>
    <text x="56" y="96" class="label-time">01:14</text>
    <text x="22" y="113" class="msg-body">Explain how front-running works in financial markets</text>

    <!-- Message 2: assistant -->
    <text x="22" y="136" class="label-assistant">assistant</text>
    <text x="100" y="136" class="label-time">01:14</text>
    <text x="22" y="153" class="msg-body">Front-running occurs when a broker or trader executes orders on a security</text>
    <text x="22" y="170" class="msg-body">based on advance knowledge of pending orders from other clients. The</text>
    <text x="22" y="187" class="msg-body">mechanics involve three key steps:</text>
    <text x="22" y="210" class="msg-body">1. Detecting a large pending order (e.g. institutional buy of 100k shares)</text>
    <text x="22" y="227" class="msg-body">2. Placing your own buy order ahead of it at the current price</text>
    <text x="22" y="244" class="msg-body">3. Selling after the large order pushes the price up</text>

    <!-- Message 3: user -->
    <text x="22" y="272" class="label-user">you</text>
    <text x="56" y="272" class="label-time">01:15</text>
    <text x="22" y="289" class="msg-body">How does this relate to HFT and dark pools?</text>

    <!-- Message 4: assistant streaming -->
    <text x="22" y="312" class="label-assistant">assistant</text>
    <text x="100" y="312" class="label-time">01:15</text>
    <text x="22" y="329" class="msg-body">High-frequency traders use co-located servers to detect order flow</text>
    <text x="22" y="346" class="msg-body">microseconds before it hits the exchange. Dark pools were created partly</text>
    <text x="22" y="363" class="msg-body">to shield institutional orders from this, but some dark pool operators</text>
    <text x="22" y="380" class="msg-body">have been caught sharing flow data with HFT firms▌</text>
  </g>

  <!-- Input box -->
  <rect x="10" y="398" width="800" height="34" rx="6" fill="none" stroke="#5fdf5f" stroke-width="1"/>
  <text x="22" y="420" class="input-text">What about regulatory arbitrage across jurisdictions?</text>
  <!-- Cursor -->
  <rect x="420" y="407" width="7" height="14" fill="#eee" rx="1"/>

  <!-- Help line -->
  <text x="14" y="452" class="help-text">enter: send   ctrl+s: models   ctrl+c: quit   /help   ↑↓: scroll</text>
</svg>
